services:
  synology-mcp:
    image: ghcr.io/binyaminyblatt/synology-mcp:latest
    container_name: synology-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # ── Streamable HTTP Server Settings ──
      MCP_HTTP: "true"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8765"
      MCP_PATH: "/mcp"
      # Bearer token required by the MCP server (Authorization: Bearer <token>)
      MCP_API_TOKEN: "${MCP_API_TOKEN:-}"

      # ── Synology DSM Connection ──
      SYNOLOGY_URL: "${SYNOLOGY_URL:-http://192.168.68.106:5000}"
      SYNOLOGY_USER: "${SYNOLOGY_USER:-your_dsm_username}"
      SYNOLOGY_PASS: "${SYNOLOGY_PASS:-your_dsm_password}"

      # ── Optional 2FA Trusted Device Token ──
      # If 2FA is enabled on your DSM account, run once inside the container:
      #   docker exec -it synology-mcp python bootstrap_2fa.py <6-digit-OTP>
      # and paste the returned device_id here:
      SYNOLOGY_DEVICE_ID: "${SYNOLOGY_DEVICE_ID:-}"

      # ── Behaviour & Safety ──
      SYNOLOGY_VERIFY_SSL: "${SYNOLOGY_VERIFY_SSL:-false}"
      SYNOLOGY_SESSION_NAME: "SynologyMCP"
      SYNOLOGY_DEVICE_NAME: "SynologyMCP"
      SYNOLOGY_ENABLE_POWER_CONTROL: "${SYNOLOGY_ENABLE_POWER_CONTROL:-false}"
